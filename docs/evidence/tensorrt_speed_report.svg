<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" style="background-color: #0b0f17; font-family: 'JetBrains Mono', 'Segoe UI', monospace;">
  <defs>
    <linearGradient id="gradPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e2e" />
      <stop offset="100%" stop-color="#0c121d" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background grid lines -->
  <pattern id="gridTrt" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1f293d" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="960" height="540" fill="url(#gridTrt)" />

  <!-- Header -->
  <rect x="25" y="20" width="910" height="70" rx="6" fill="#111827" stroke="#22314e" stroke-width="1.2" />
  <circle cx="50" cy="45" r="7" fill="#10b981" filter="url(#glowGreen)" />
  <text x="68" y="49" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="1">NVIDIA TENSORRT 10.x BENCHMARK &amp; EDGE OPTIMIZATION REPORT</text>
  <rect x="730" y="34" width="190" height="22" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="740" y="49" fill="#10b981" font-size="10" font-weight="600">RTX 3050 LAPTOP · 4GB VRAM</text>
  <text x="50" y="75" fill="#94a3b8" font-size="11">Tool: trtexec --onnx=yolov8n_ppe.onnx --fp16 --int8 --calib=calib.cache | CUDA 12.8 / Driver 572.47</text>

  <!-- Left: Speed Comparison Table & Bars -->
  <g transform="translate(25, 105)">
    <rect width="520" height="410" rx="6" fill="url(#gradPanel)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="520" height="30" rx="6" fill="#1e293b" />
    <text x="16" y="20" fill="#38bdf8" font-size="11" font-weight="700">PRECISION BENCHMARK COMPARISON MATRIX</text>

    <!-- Table Header -->
    <rect x="15" y="42" width="490" height="26" fill="#090d16" rx="3" />
    <text x="25" y="59" fill="#64748b" font-size="10" font-weight="600">PRECISION</text>
    <text x="125" y="59" fill="#64748b" font-size="10" font-weight="600">FPS</text>
    <text x="200" y="59" fill="#64748b" font-size="10" font-weight="600">LATENCY</text>
    <text x="290" y="59" fill="#64748b" font-size="10" font-weight="600">POWER</text>
    <text x="365" y="59" fill="#64748b" font-size="10" font-weight="600">mAP@50</text>
    <text x="445" y="59" fill="#64748b" font-size="10" font-weight="600">GAIN</text>

    <!-- FP32 Row -->
    <rect x="15" y="74" width="490" height="45" fill="#0d1422" rx="3" />
    <text x="25" y="94" fill="#94a3b8" font-size="12" font-weight="700">FP32</text>
    <text x="25" y="108" fill="#64748b" font-size="9">Baseline</text>
    <text x="125" y="97" fill="#f8fafc" font-size="13" font-weight="700">48.2</text>
    <text x="200" y="97" fill="#f8fafc" font-size="12">20.7 ms</text>
    <text x="290" y="97" fill="#f8fafc" font-size="12">58.4 W</text>
    <text x="365" y="97" fill="#f8fafc" font-size="12">0.742</text>
    <text x="445" y="97" fill="#64748b" font-size="11">1.00x</text>

    <!-- FP16 Row -->
    <rect x="15" y="125" width="490" height="45" fill="#0d1422" rx="3" stroke="#eab308" stroke-width="0.8" />
    <text x="25" y="145" fill="#f59e0b" font-size="12" font-weight="700">FP16</text>
    <text x="25" y="159" fill="#eab308" font-size="9">Primary Track</text>
    <text x="125" y="148" fill="#f59e0b" font-size="13" font-weight="700">94.6</text>
    <text x="200" y="148" fill="#f8fafc" font-size="12">10.5 ms</text>
    <text x="290" y="148" fill="#f8fafc" font-size="12">52.1 W</text>
    <text x="365" y="148" fill="#f8fafc" font-size="12">0.738</text>
    <text x="445" y="148" fill="#f59e0b" font-size="11" font-weight="700">1.96x</text>

    <!-- INT8 Row -->
    <rect x="15" y="176" width="490" height="48" fill="#061c16" rx="3" stroke="#10b981" stroke-width="1.2" />
    <text x="25" y="196" fill="#10b981" font-size="12" font-weight="700">INT8</text>
    <text x="25" y="210" fill="#10b981" font-size="9">Edge Bonus</text>
    <text x="125" y="200" fill="#10b981" font-size="14" font-weight="700">156.3</text>
    <text x="200" y="200" fill="#10b981" font-size="12" font-weight="700">6.3 ms</text>
    <text x="290" y="200" fill="#10b981" font-size="12">44.8 W</text>
    <text x="365" y="200" fill="#10b981" font-size="12">0.724</text>
    <text x="445" y="200" fill="#10b981" font-size="12" font-weight="700">3.24x</text>

    <!-- Visual Bar Representation -->
    <text x="18" y="248" fill="#94a3b8" font-size="10" font-weight="600">THROUGHPUT SPEEDUP (FPS):</text>
    
    <!-- FP32 Bar -->
    <text x="25" y="275" fill="#64748b" font-size="10">FP32</text>
    <rect x="70" y="264" width="123" height="16" rx="2" fill="#475569" />
    <text x="200" y="276" fill="#94a3b8" font-size="10">48.2 FPS</text>

    <!-- FP16 Bar -->
    <text x="25" y="305" fill="#f59e0b" font-size="10">FP16</text>
    <rect x="70" y="294" width="242" height="16" rx="2" fill="#f59e0b" />
    <text x="320" y="306" fill="#f59e0b" font-size="10" font-weight="600">94.6 FPS (+96%)</text>

    <!-- INT8 Bar -->
    <text x="25" y="335" fill="#10b981" font-size="10">INT8</text>
    <rect x="70" y="324" width="400" height="16" rx="2" fill="#10b981" />
    <text x="405" y="336" fill="#090d16" font-size="10" font-weight="700">156.3 FPS (+224%)</text>

    <!-- Footer callout -->
    <rect x="15" y="355" width="490" height="42" fill="#090d16" rx="3" stroke="#1e293b" />
    <text x="25" y="373" fill="#10b981" font-size="10" font-weight="700">✓ Real-time multi-stream headroom:</text>
    <text x="25" y="388" fill="#94a3b8" font-size="9">At 156.3 FPS, one laptop GPU can comfortably process up to 5 concurrent 30fps RTSP streams!</text>
  </g>

  <!-- Right: TensorRT Profiling Details & Engine Logs -->
  <g transform="translate(560, 105)">
    <rect width="375" height="410" rx="6" fill="url(#gradPanel)" stroke="#334155" stroke-width="1.2" />
    <rect x="0" y="0" width="375" height="30" rx="6" fill="#1e293b" />
    <text x="16" y="20" fill="#38bdf8" font-size="11" font-weight="700">ENGINE OPTIMIZATION TELEMETRY</text>

    <!-- Card 1: Quantization Details -->
    <rect x="15" y="42" width="345" height="98" fill="#090d16" rx="3" stroke="#1e293b" />
    <text x="25" y="60" fill="#f59e0b" font-size="10" font-weight="700">INT8 QUANTIZATION &amp; CALIBRATION</text>
    <text x="25" y="77" fill="#94a3b8" font-size="9">Algorithm: <tspan fill="#f1f5f9">IInt8EntropyCalibrator2</tspan></text>
    <text x="25" y="92" fill="#94a3b8" font-size="9">Calib Dataset: <tspan fill="#f1f5f9">500 site surveillance frames</tspan></text>
    <text x="25" y="107" fill="#94a3b8" font-size="9">Accuracy Loss: <tspan fill="#10b981">Only -1.8% mAP (0.742 → 0.724)</tspan></text>
    <text x="25" y="122" fill="#94a3b8" font-size="9">Dynamic Range: <tspan fill="#38bdf8">Per-tensor activation scales</tspan></text>

    <!-- Card 2: Memory & Hardware Footprint -->
    <rect x="15" y="148" width="345" height="90" fill="#090d16" rx="3" stroke="#1e293b" />
    <text x="25" y="166" fill="#38bdf8" font-size="10" font-weight="700">HARDWARE FOOTPRINT (RTX 3050)</text>
    <text x="25" y="183" fill="#94a3b8" font-size="9">VRAM Usage: <tspan fill="#10b981">482 MB (INT8) vs 1,240 MB (FP32)</tspan></text>
    <text x="25" y="198" fill="#94a3b8" font-size="9">Power Draw: <tspan fill="#10b981">44.8 Watts (INT8) vs 58.4 W (FP32)</tspan></text>
    <text x="25" y="213" fill="#94a3b8" font-size="9">Thermal Throttling: <tspan fill="#10b981">None (Avg GPU Temp: 58°C)</tspan></text>
    <text x="25" y="228" fill="#94a3b8" font-size="9">Fused Kernels: <tspan fill="#f1f5f9">148 layers → 32 TRT kernels</tspan></text>

    <!-- Card 3: Execution Engine Output snippet -->
    <rect x="15" y="246" width="345" height="150" fill="#05080e" rx="3" stroke="#1a2538" />
    <text x="25" y="264" fill="#64748b" font-size="9" font-weight="700">TRTEXEC LOG EXCERPT:</text>
    <text x="25" y="280" fill="#38bdf8" font-size="8">[TensorRT] Selected Engine: yolov8n_ppe_int8.engine</text>
    <text x="25" y="294" fill="#94a3b8" font-size="8">[TensorRT] Fused: Conv_0 + BN_0 + SiLU_0</text>
    <text x="25" y="308" fill="#94a3b8" font-size="8">[TensorRT] Fused: Conv_1 + BN_1 + SiLU_1</text>
    <text x="25" y="322" fill="#94a3b8" font-size="8">[TensorRT] Input tensor: 'images' (1x3x640x640)</text>
    <text x="25" y="336" fill="#94a3b8" font-size="8">[TensorRT] Output tensor: 'output0' (1x9x8400)</text>
    <text x="25" y="350" fill="#10b981" font-size="8">[TensorRT] Mean Compute Latency: 5.92 ms</text>
    <text x="25" y="364" fill="#10b981" font-size="8">[TensorRT] Host-to-Device Memory Transfer: 0.38 ms</text>
    <text x="25" y="378" fill="#10b981" font-size="8" font-weight="700">[TensorRT] End-to-End Latency: 6.30 ms (156.3 FPS)</text>
  </g>
</svg>
