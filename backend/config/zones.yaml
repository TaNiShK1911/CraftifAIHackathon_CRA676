# zones.yaml — Display copy of the zones configured inside PipeGen.
# Used by the frontend to draw overlays. Keep in sync with what you define in PipeGen.
#
# Each zone is a polygon given as a list of [x, y] points in 0..1 normalised coordinates.

zones:
  - id: "hazard_zone_1"
    name: "Crane Swing Zone"
    color: "#FF4444"
    polygon:
      - [0.1, 0.3]
      - [0.5, 0.3]
      - [0.5, 0.8]
      - [0.1, 0.8]

  - id: "hazard_zone_2"
    name: "Excavation Perimeter"
    color: "#FF8C00"
    polygon:
      - [0.55, 0.4]
      - [0.9,  0.4]
      - [0.9,  0.85]
      - [0.55, 0.85]
