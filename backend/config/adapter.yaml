# adapter.yaml — Maps raw PipeGen MQTT/JSON payload fields to canonical schema fields.
#
# Configured for CraftifAI PipeGen output schema on RTX 3050 Laptop GPU.

# Top-level message fields
source_id:  "source_id"       # key that holds the camera/stream identifier
frame_id:   "frame"           # key that holds the frame number (int)
timestamp:  "pts_ns"          # timestamp (pts in nanoseconds)

# Path inside the message that holds the list of per-object detections
objects_path: "objects"

# Per-object field mapping
fields:
  track_id:   "id"
  label:      "label"
  confidence: "confidence"
  bbox:       "bbox"          # dict {left, top, width, height} or list
  zone_id:    "zone_id"

# bbox coordinate format coming from PipeGen
bbox_format: "xywh"           # "xyxy" | "xywh"

# Native resolution used to normalise pixel bbox -> 0..1 fractions
frame_size: [2560, 1440]

# Labels that indicate a hazard zone intrusion (any label in this list
# combined with a non-null zone_id triggers ZONE_INTRUSION)
zone_labels:
  - "person"

# Labels that directly map to PPE violations
ppe_violation_labels:
  - "no_hardhat"
  - "no_vest"
  - "no_helmet"
  - "no_safety_vest"
